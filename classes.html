<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes 8, 9 & 10 Mathematics | NeoMath</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="data/class8.js"></script>
  <script src="data/class9.js"></script>
  <script src="data/class10.js"></script>
  <script src="js/main.js" defer></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand-logo">
        <span>📐 NeoMath</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="classes.html?class=8" class="nav-link" id="nav-c8">Class 8</a></li>
        <li><a href="classes.html?class=9" class="nav-link" id="nav-c9">Class 9</a></li>
        <li><a href="classes.html?class=10" class="nav-link" id="nav-c10">Class 10</a></li>
        <li><a href="youtube.html" class="nav-link">YouTube</a></li>
        <li><a href="blogs.html" class="nav-link">Blogs</a></li>
        <li><a href="ebooks.html" class="nav-link">E-Books</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
      <a href="contact.html" class="btn btn-primary">Ask a Doubt</a>
    </div>
  </header>

  <main class="container" style="padding: 3rem 0;">
    <!-- Class Selector Bar -->
    <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem; flex-wrap: wrap;">
      <span style="font-weight: 700; color: var(--slate-700);">Switch Grade:</span>
      <a href="classes.html?class=8" class="btn btn-outline" id="grade-btn-8">Class 8</a>
      <a href="classes.html?class=9" class="btn btn-outline" id="grade-btn-9">Class 9</a>
      <a href="classes.html?class=10" class="btn btn-outline" id="grade-btn-10">Class 10 (Board)</a>
    </div>

    <!-- Header for selected class -->
    <div style="margin-bottom: 2.5rem;">
      <span class="badge badge-indigo" id="grade-badge">Class 10</span>
      <h1 id="grade-title" style="font-size: 2.5rem; font-weight: 800; margin-top: 0.5rem;">Class 10 Mathematics</h1>
      <p id="grade-desc" style="color: var(--slate-600); max-width: 800px;">Comprehensive syllabus chapters, video masterclasses, and board exam resources.</p>
    </div>

    <!-- 3 Sub-pages / Tabs: Chapters, Videos, Practice / Resources -->
    <div class="subtabs">
      <button class="subtab-btn active" id="tab-btn-chapters" onclick="switchClassTab('chapters')">📖 Chapters & Concepts</button>
      <button class="subtab-btn" id="tab-btn-videos" onclick="switchClassTab('videos')">▶ Video Lessons</button>
      <button class="subtab-btn" id="tab-btn-resources" onclick="switchClassTab('resources')">📝 Practice & Resources</button>
    </div>

    <!-- Tab 1: Chapters -->
    <section id="tab-content-chapters">
      <div class="chapters-grid" id="chapters-container">
        <!-- Rendered dynamically from data/class8.js, class9.js, or class10.js -->
      </div>
    </section>

    <!-- Tab 2: Videos -->
    <section id="tab-content-videos" style="display: none;">
      <div class="class-cards-grid" id="videos-container">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Tab 3: Practice & Resources -->
    <section id="tab-content-resources" style="display: none;">
      <div class="class-cards-grid" id="resources-container">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>

  <script>
    // URL params reader to switch Class 8, 9, or 10 cleanly
    const urlParams = new URLSearchParams(window.location.search);
    const selectedGrade = urlParams.get('class') || '10';
    const selectedTab = urlParams.get('tab') || 'chapters';

    // Highlight button
    const btn = document.getElementById('grade-btn-' + selectedGrade);
    if (btn) {
      btn.classList.remove('btn-outline');
      btn.classList.add('btn-primary');
    }

    const navLink = document.getElementById('nav-c' + selectedGrade);
    if (navLink) navLink.classList.add('active');

    // Pick data
    const data = (selectedGrade === '8') ? window.NEOMATH_CLASS8 : (selectedGrade === '9' ? window.NEOMATH_CLASS9 : window.NEOMATH_CLASS10);

    if (data) {
      document.getElementById('grade-badge').innerText = 'Class ' + data.grade;
      document.getElementById('grade-title').innerText = data.title;
      
      // Render Chapters
      const chContainer = document.getElementById('chapters-container');
      chContainer.innerHTML = data.chapters.map(ch => `
        <div class="chapter-card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
            <span class="badge badge-indigo">Chapter ${ch.number}</span>
            <span style="font-size: 0.8rem; color: var(--slate-500);">${ch.difficulty}</span>
          </div>
          <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">${ch.title}</h3>
          <p style="color: var(--slate-600); font-size: 0.9rem; margin-bottom: 1rem;">${ch.description}</p>
          
          <div style="margin-bottom: 1rem;">
            <strong style="font-size: 0.85rem; color: var(--slate-700);">Key Formulas:</strong>
            ${ch.formulas.map(f => `<div class="formula-box"><strong>${f.name}:</strong> ${f.formula}</div>`).join('')}
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--slate-200); padding-top: 1rem;">
            <span style="font-size: 0.85rem; color: var(--slate-500);">${ch.exercisesCount} Exercises</span>
            <a href="${ch.ncertChapterUrl || '#'}" target="_blank" rel="noopener" class="btn btn-outline" style="font-size: 0.8rem; padding: 6px 12px;">Official NCERT PDF ↗</a>
          </div>
        </div>
      `).join('');

      // Render Videos
      const vidContainer = document.getElementById('videos-container');
      vidContainer.innerHTML = data.videos.map(v => `
        <div class="class-card">
          <div style="position: relative; border-radius: 8px; overflow: hidden; margin-bottom: 1rem; background: #000; height: 180px;">
            <img src="${v.thumbnailUrl}" alt="${v.title}" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.85;">
            <span style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem;">${v.duration}</span>
          </div>
          <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem;">${v.title}</h3>
          <p style="color: var(--slate-600); font-size: 0.85rem; margin-bottom: 1rem; flex: 1;">${v.description}</p>
          <a href="${v.youtubeUrl}" target="_blank" rel="noopener" class="btn btn-primary" style="font-size: 0.85rem;">Watch on YouTube ▶</a>
        </div>
      `).join('');

      // Render Resources
      const resContainer = document.getElementById('resources-container');
      resContainer.innerHTML = data.resources.map(r => `
        <div class="class-card">
          <div class="class-card-header">
            <span class="badge badge-emerald">${r.type}</span>
            <span style="font-size: 0.8rem; color: var(--slate-500);">${r.fileSize} • ${r.pages} Pages</span>
          </div>
          <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem;">${r.title}</h3>
          <p style="color: var(--slate-600); font-size: 0.9rem; margin-bottom: 1.5rem; flex: 1;">${r.description}</p>
          <a href="${r.downloadUrl}" class="btn btn-outline" style="width: 100%; font-size: 0.9rem;" onclick="alert('Sample resource download simulation: PDF opened!')">Download Study Material ↓</a>
        </div>
      `).join('');

      // Switch to preselected tab if passed
      if (selectedTab) {
        window.switchClassTab(selectedTab);
      }
    }
  </script>
</body>
</html>
